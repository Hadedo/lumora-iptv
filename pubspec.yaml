name: lumora
description: "Lumora | لُمورا - مشغّل IPTV أنيق وسريع للهاتف."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة
  flutter_riverpod: ^2.5.1

  # المشغّل
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # التخزين المحلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # الشبكة والبيانات
  dio: ^5.4.3+1
  xml: ^6.5.0
  crypto: ^3.0.3
  connectivity_plus: ^6.0.3

  # الواجهة
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  intl: ^0.20.2

  # النظام (إصدارات متوافقة مع media_kit_video)
  file_picker: ^8.0.3
  wakelock_plus: ^1.2.5
  screen_brightness: ^0.2.2+1
  volume_controller: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false
